name: Build and deploy H5 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARO_APP_APP_ID: taluo-h5
      TARO_APP_PUBLIC_PATH: /taluo/
      TARO_APP_AI_API_URL: https://api.taluo.lydiaowo.com
      TARO_APP_SUPABASE_URL: ${{ vars.TARO_APP_SUPABASE_URL }}
      TARO_APP_SUPABASE_ANON_KEY: ${{ vars.TARO_APP_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build H5
        run: pnpm build:h5:production
      - name: Prepare Pages artifact
        run: node scripts/preparePages.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
